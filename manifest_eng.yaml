# unique service name
name: TheHonorOfAMercenary
language: eng
installment: exmachina

# required human readable info
display_name: The Honor of a Mercenary
description: |
  This mod ports the ExMachina Demo storyline to Community Remaster and also introduces a number of fixes and improvements to the game.
authors: MrKarfen

# optional human readable info
logo: Assets/Logo.png
install_banner: Assets/Banner_RU.png
release_date: "01.05.2023"
link: https://vk.com/mods_by_mrkarfen
tags: [story, gameplay, bugfix, audio]
change_log: Assets/Info/ChangeLog_eng.md
other_info: Assets/Info/OtherInfo_eng.md
screenshots:
    - img: Assets/Screenshots/Screen01.png
    - img: Assets/Screenshots/Screen02.png  
    - img: Assets/Screenshots/Screen03.png   
    - img: Assets/Screenshots/Screen04.png  

# installation confguration
patcher_version_requirement: "2.1.1"
no_base_content: false
compatible_patch_versions: true
# translations: [eng]

prerequisites:
  - name: [community_remaster]
    versions:
     - ">=1.14.1"
    optional_content:
    - hd_gun_models
    - hd_vehicle_models 
    - ost_remaster 
    - english_localization

data_dirs:
  - "Files/01_Basic_Files/data"
  
options_base_dir: "Files/02_Options"
config_options:
  firstLevel: "Demo"

optional_content:
  - name: NewQuests
    display_name: New Quests
    description: |
      Adds new side quests that were not present in ExMachina Demo.
  - name: NewSounds
    display_name: New Main Character Combat Voice-Over
    description: |
      Replaces the main character's combat voice-over (lines when taking damage, killing enemies, etc.). The original Ex Machina demo version used lines from the main game's protagonist, whose voice is very different from the demo protagonist's voice. If this option is disabled, the main character will remain silent in combat.
  - name: AmmoMiniMod
    display_name: Ammo MiniMod
    default_option: skip
    description: |
      Adds limited ammunition for all existing weapons. Ammo prices depend on caliber and weapon type.
  - name: english_localization
    display_name: English Localization
    forced_option: True
    description: Full text-only localization of The Honor of a Mercenary.